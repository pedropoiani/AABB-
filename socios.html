<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sócios - Sistema de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .card-member {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-member:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .card-member::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #059669);
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 2rem;
    }

    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-pulse {
      animation: pulse-soft 2s infinite;
    }

    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .table-row {
      transition: background-color 0.2s ease;
    }

    .table-row:hover {
      background-color: #f8fafc;
    }

    .toggle-view {
      display: flex;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .toggle-btn {
      padding: 0.5rem 1rem;
      background: white;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: #10b981;
      color: white;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .status-indicator {
      border-radius: 50%;
    }

    .status-ativo {
      background: #10b981;
    }

    .status-pendente {
      background: #f59e0b;
    }

    .status-inativo {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .plano-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .plano-basico {
      background: #e2e8f0;
      color: #475569;
    }

    .plano-premium {
      background: #ddd6fe;
      color: #7c3aed;
    }

    .plano-vip {
      background: #fef3c7;
      color: #d97706;
    }
  </style>
 </head>
 <body class="h-full bg-slate-50">
  <div id="menu-container"></div>
  <div id="app" class="h-full overflow-auto">

   <main class="ml-64 p-8">
    <header class="mb-8">
     <div class="flex items-center justify-between">
      <div>
       <h2 class="text-3xl font-bold text-slate-800">Lista de Sócios</h2>
       <p class="text-slate-500 mt-1" id="count-socios">Total: 0 sócios</p>
      </div>
      <button onclick="openNewMemberModal()" class="flex items-center gap-2 px-6 py-3 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 shadow-lg shadow-emerald-600/30 transition-all">
       <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
       </svg> Novo Sócio
      </button>
     </div>
    </header>

    <div class="bg-white rounded-xl p-6 shadow-sm mb-6">
     <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-6">
      <div class="flex-1 relative w-full md:w-auto">
       <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
       </svg>
       <input type="text" id="search-input" placeholder="Buscar por nome, email ou telefone..." class="w-full pl-12 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
      </div>
      <div class="flex gap-3 flex-wrap">
       <select id="filter-status" class="px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
        <option value="">Todos os status</option>
        <option value="ativo">Ativos</option>
        <option value="pendente">Pendentes</option>
        <option value="inativo">Inativos</option>
       </select>
       <select id="filter-plano" class="px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
        <option value="">Todos os planos</option>
        <option value="basico">Básico</option>
        <option value="premium">Premium</option>
        <option value="vip">VIP</option>
       </select>
      </div>
     </div>

     <div class="flex justify-end">
      <div class="toggle-view">
       <button class="toggle-btn active" id="btn-cards" onclick="changeView('cards')">
        <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg> Cards
       </button>
       <button class="toggle-btn" id="btn-list" onclick="changeView('list')">
        <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg> Lista
       </button>
      </div>
     </div>
    </div>

    <div id="view-cards" class="grid-cards">
    </div>

    <div id="view-list" class="hidden bg-white rounded-xl shadow-sm overflow-hidden">
     <table class="w-full">
      <thead class="bg-slate-50">
       <tr>
        <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Sócio</th>
        <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Contato</th>
        <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Plano</th>
        <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
        <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Adesão</th>
        <th class="text-center px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Ações</th>
       </tr>
      </thead>
      <tbody id="list-body" class="divide-y divide-slate-100">
      </tbody>
     </table>
    </div>

    <div id="empty-state" class="hidden text-center py-12">
     <div class="w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4">
      <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
     </div>
     <p class="text-slate-500 font-medium">Nenhum sócio encontrado</p>
     <p class="text-slate-400 text-sm mt-1">Ajuste os filtros ou adicione um novo sócio</p>
    </div>
   </main>

   <div id="modal-socio" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop absolute inset-0" onclick="closeModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white rounded-2xl shadow-2xl p-8 max-h-[90%] overflow-y-auto">
     <div class="flex items-center justify-between mb-6">
      <h3 id="modal-title" class="text-2xl font-bold text-slate-800">Novo Sócio</h3>
      <button onclick="closeModal()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center transition-colors">
       <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
       </svg>
      </button>
     </div>
     <form id="form-socio" class="space-y-5">
      <input type="hidden" id="socio-id">
      <div>
       <label for="socio-nome" class="block text-sm font-semibold text-slate-700 mb-2">Nome Completo *</label>
       <input type="text" id="socio-nome" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="Digite o nome completo">
      </div>
      <div class="grid grid-cols-2 gap-4">
       <div>
        <label for="socio-email" class="block text-sm font-semibold text-slate-700 mb-2">Email *</label>
        <input type="email" id="socio-email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="email@exemplo.com">
       </div>
       <div>
        <label for="socio-telefone" class="block text-sm font-semibold text-slate-700 mb-2">Telefone *</label>
        <input type="tel" id="socio-telefone" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="(00) 00000-0000">
       </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
       <div>
        <label for="socio-nascimento" class="block text-sm font-semibold text-slate-700 mb-2">Data de Nascimento</label>
        <input type="date" id="socio-nascimento" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
       </div>
       <div>
        <label for="socio-plano" class="block text-sm font-semibold text-slate-700 mb-2">Plano *</label>
        <select id="socio-plano" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all bg-white">
         <option value="">Selecione...</option>
         <option value="basico">Básico</option>
         <option value="premium">Premium</option>
         <option value="vip">VIP</option>
        </select>
       </div>
      </div>
      <div>
       <label for="socio-status" class="block text-sm font-semibold text-slate-700 mb-2">Status *</label>
       <select id="socio-status" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all bg-white">
        <option value="ativo">Ativo</option>
        <option value="pendente">Pendente</option>
        <option value="inativo">Inativo</option>
       </select>
      </div>
      <div>
       <label for="socio-foto" class="block text-sm font-semibold text-slate-700 mb-2">Foto (URL)</label>
       <input type="url" id="socio-foto" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="https://exemplo.com/foto.jpg">
      </div>
      <div class="flex gap-3 pt-4">
       <button type="button" onclick="closeModal()" class="flex-1 px-6 py-3 border border-slate-200 text-slate-600 rounded-xl font-semibold hover:bg-slate-50 transition-colors"> Cancelar </button>
       <button type="submit" id="btn-salvar" class="flex-1 px-6 py-3 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-600/30"> Salvar Sócio </button>
      </div>
     </form>
    </div>
   </div>

   <div id="modal-delete" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop absolute inset-0" onclick="closeDeleteModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
     <div class="text-center">
      <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
       <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
       </svg>
      </div>
      <h3 class="text-xl font-bold text-slate-800 mb-2">Confirmar Exclusão</h3>
      <p class="text-slate-500 mb-6">Tem certeza que deseja excluir este sócio? Esta ação não pode ser desfeita.</p>
      <div class="flex gap-3">
       <button onclick="closeDeleteModal()" class="flex-1 px-4 py-2 border border-slate-200 text-slate-600 rounded-lg font-medium hover:bg-slate-50">Cancelar</button>
       <button id="btn-confirm-delete" onclick="deleteSocio()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700">Excluir</button>
      </div>
     </div>
    </div>
   </div>

   <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <div class="bg-slate-800 text-white px-6 py-4 rounded-xl shadow-lg flex items-center gap-3">
     <span id="toast-icon">✅</span>
     <span id="toast-message">Operação realizada com sucesso!</span>
    </div>
   </div>
  </div>

  <script>
    let socios = [
      {
        id: 'SOC-1',
        nome: 'João Silva',
        email: 'joao@email.com',
        telefone: '(11) 99999-9999',
        dataNascimento: '1990-01-15',
        plano: 'basico',
        status: 'ativo',
        foto: '',
        dataAdesao: '2024-01-01T00:00:00.000Z'
      },
      {
        id: 'SOC-2',
        nome: 'Maria Santos',
        email: 'maria@email.com',
        telefone: '(11) 88888-8888',
        dataNascimento: '1985-05-20',
        plano: 'premium',
        status: 'ativo',
        foto: '',
        dataAdesao: '2024-01-15T00:00:00.000Z'
      },
      {
        id: 'SOC-3',
        nome: 'Pedro Oliveira',
        email: 'pedro@email.com',
        telefone: '(11) 77777-7777',
        dataNascimento: '1992-08-10',
        plano: 'vip',
        status: 'pendente',
        foto: '',
        dataAdesao: '2024-02-01T00:00:00.000Z'
      }
    ];
    let currentView = 'cards';
    let socioToDelete = null;
    let isEditing = false;

    function changeView(view) {
      currentView = view;
      
      document.getElementById('btn-cards').classList.toggle('active', view === 'cards');
      document.getElementById('btn-list').classList.toggle('active', view === 'list');
      
      document.getElementById('view-cards').classList.toggle('hidden', view !== 'cards');
      document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
      
      renderView();
    }

    function getFilteredSocios() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      const planoFilter = document.getElementById('filter-plano').value;

      return socios.filter(socio => {
        const matchesSearch = socio.nome.toLowerCase().includes(searchTerm) ||
                             socio.email.toLowerCase().includes(searchTerm) ||
                             socio.telefone.includes(searchTerm);
        const matchesStatus = !statusFilter || socio.status === statusFilter;
        const matchesPlano = !planoFilter || socio.plano === planoFilter;
        return matchesSearch && matchesStatus && matchesPlano;
      });
    }

    function renderView() {
      const filtered = getFilteredSocios();
      document.getElementById('count-socios').textContent = `Total: ${filtered.length} sócios`;

      if (filtered.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('view-cards').innerHTML = '';
        document.getElementById('list-body').innerHTML = '';
        return;
      }

      document.getElementById('empty-state').classList.add('hidden');

      if (currentView === 'cards') {
        renderCards(filtered);
      } else {
        renderList(filtered);
      }
    }

    function renderCards(filtered) {
      const container = document.getElementById('view-cards');
      
      container.innerHTML = filtered.map(socio => {
        const initials = socio.nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const dataAdesao = socio.dataAdesao ? new Date(socio.dataAdesao).toLocaleDateString('pt-BR') : '-';
        
        const statusColors = {
          ativo: '#10b981',
          pendente: '#f59e0b',
          inativo: '#ef4444'
        };

        const planoLabels = {
          basico: 'Básico',
          premium: 'Premium',
          vip: 'VIP'
        };

        const planoClasses = {
          basico: 'plano-basico',
          premium: 'plano-premium',
          vip: 'plano-vip'
        };

        return `
          <div class="card-member bg-white rounded-xl shadow-sm overflow-hidden relative">
            <div class="relative h-32 photo-placeholder" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
              ${socio.foto ? `<img src="${socio.foto}" alt="${socio.nome}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='${initials}';">` : ''}
              <span style="display: ${socio.foto ? 'none' : 'flex'};" class="text-3xl font-bold">${initials}</span>
              <div class="absolute top-3 right-3 flex gap-2">
                <span class="status-indicator" style="background: ${statusColors[socio.status]}; width: 12px; height: 12px; border-radius: 50%;"></span>
              </div>
            </div>
            
            <div class="p-5">
              <h3 class="font-bold text-lg text-slate-800 mb-1">${socio.nome}</h3>
              <p class="text-sm text-slate-500 mb-4">${socio.id}</p>
              
              <div class="space-y-2 mb-4">
                <p class="text-xs text-slate-600"><strong>Email:</strong> ${socio.email}</p>
                <p class="text-xs text-slate-600"><strong>Telefone:</strong> ${socio.telefone}</p>
                ${socio.dataNascimento ? `<p class="text-xs text-slate-600"><strong>Nascimento:</strong> ${new Date(socio.dataNascimento).toLocaleDateString('pt-BR')}</p>` : ''}
                <p class="text-xs text-slate-600"><strong>Adesão:</strong> ${dataAdesao}</p>
              </div>

              <div class="flex items-center gap-2 mb-4">
                <span class="plano-badge ${planoClasses[socio.plano]}">${planoLabels[socio.plano]}</span>
                <span style="font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 9999px; ${
                  socio.status === 'ativo' ? 'background: #d1fae5; color: #065f46;' :
                  socio.status === 'pendente' ? 'background: #fef3c7; color: #92400e;' :
                  'background: #fee2e2; color: #991b1b;'
                }">
                  ${socio.status === 'ativo' ? '✓ Ativo' : socio.status === 'pendente' ? '⏳ Pendente' : '✕ Inativo'}
                </span>
              </div>

              <div class="flex gap-2 pt-4 border-t border-slate-100">
                <button onclick="window.location.href='perfil-socio.html?id=${socio.id}'" class="flex-1 px-3 py-2 text-sm font-medium text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors">
                  Ver Perfil
                </button>
                <button onclick="editSocio('${socio.id}')" class="flex-1 px-3 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                  Editar
                </button>
                <button onclick="confirmDelete('${socio.id}')" class="flex-1 px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                  Excluir
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderList(filtered) {
      const tbody = document.getElementById('list-body');
      
      const statusLabels = {
        ativo: 'Ativo',
        pendente: 'Pendente',
        inativo: 'Inativo'
      };

      const planoLabels = {
        basico: 'Básico',
        premium: 'Premium',
        vip: 'VIP'
      };

      const statusColors = {
        ativo: 'bg-emerald-100 text-emerald-700',
        pendente: 'bg-amber-100 text-amber-700',
        inativo: 'bg-red-100 text-red-700'
      };

      const planoBadge = {
        basico: 'bg-slate-100 text-slate-700',
        premium: 'bg-purple-100 text-purple-700',
        vip: 'bg-amber-100 text-amber-700'
      };

      tbody.innerHTML = filtered.map(socio => {
        const initials = socio.nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const dataAdesao = socio.dataAdesao ? new Date(socio.dataAdesao).toLocaleDateString('pt-BR') : '-';

        return `
          <tr class="table-row">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white font-bold text-sm">
                  ${initials}
                </div>
                <div>
                  <p class="font-semibold text-slate-800">${socio.nome}</p>
                  <p class="text-sm text-slate-400">ID: ${socio.id}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <p class="text-slate-600 text-sm">${socio.email}</p>
              <p class="text-slate-400 text-xs">${socio.telefone}</p>
            </td>
            <td class="px-6 py-4">
              <span class="plano-badge ${planoBadge[socio.plano]}">${planoLabels[socio.plano]}</span>
            </td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColors[socio.status]}">
                ${statusLabels[socio.status]}
              </span>
            </td>
            <td class="px-6 py-4 text-slate-600 text-sm">${dataAdesao}</td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <button onclick="window.location.href='perfil-socio.html?id=${socio.id}'" class="w-9 h-9 rounded-lg hover:bg-emerald-50 flex items-center justify-center transition-colors text-emerald-600" title="Ver Perfil">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </button>
                <button onclick="editSocio('${socio.id}')" class="w-9 h-9 rounded-lg hover:bg-blue-50 flex items-center justify-center transition-colors text-blue-600" title="Editar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </button>
                <button onclick="confirmDelete('${socio.id}')" class="w-9 h-9 rounded-lg hover:bg-red-50 flex items-center justify-center transition-colors text-red-600" title="Excluir">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openNewMemberModal() {
      document.getElementById('modal-socio').classList.remove('hidden');
      document.getElementById('form-socio').reset();
      document.getElementById('socio-id').value = '';
      document.getElementById('modal-title').textContent = 'Novo Sócio';
      document.getElementById('btn-salvar').textContent = 'Salvar Sócio';
      isEditing = false;
    }

    function closeModal() {
      document.getElementById('modal-socio').classList.add('hidden');
    }

    function editSocio(id) {
      const socio = socios.find(s => s.id === id);
      if (!socio) return;

      isEditing = true;
      document.getElementById('socio-id').value = id;
      document.getElementById('socio-nome').value = socio.nome;
      document.getElementById('socio-email').value = socio.email;
      document.getElementById('socio-telefone').value = socio.telefone;
      document.getElementById('socio-nascimento').value = socio.dataNascimento || '';
      document.getElementById('socio-plano').value = socio.plano;
      document.getElementById('socio-status').value = socio.status;
      document.getElementById('socio-foto').value = socio.foto || '';
      document.getElementById('modal-title').textContent = 'Editar Sócio';
      document.getElementById('btn-salvar').textContent = 'Atualizar Sócio';
      document.getElementById('modal-socio').classList.remove('hidden');
    }

    function confirmDelete(id) {
      socioToDelete = id;
      document.getElementById('modal-delete').classList.remove('hidden');
    }

    function closeDeleteModal() {
      document.getElementById('modal-delete').classList.add('hidden');
      socioToDelete = null;
    }

    function deleteSocio() {
      if (!socioToDelete) return;

      socios = socios.filter(s => s.id !== socioToDelete);
      showToast('Sócio excluído com sucesso!', '✅');
      closeDeleteModal();
      renderView();
    }

    function saveSocio(event) {
      event.preventDefault();
      
      const id = document.getElementById('socio-id').value;
      const nome = document.getElementById('socio-nome').value.trim();
      const email = document.getElementById('socio-email').value.trim();
      const telefone = document.getElementById('socio-telefone').value.trim();
      const dataNascimento = document.getElementById('socio-nascimento').value;
      const plano = document.getElementById('socio-plano').value;
      const status = document.getElementById('socio-status').value;
      const foto = document.getElementById('socio-foto').value.trim();

      if (!nome || !email || !telefone || !plano) {
        showToast('Preencha todos os campos obrigatórios', '⚠️');
        return;
      }

      if (isEditing) {
        const index = socios.findIndex(s => s.id === id);
        if (index !== -1) {
          socios[index] = { ...socios[index], nome, email, telefone, dataNascimento, plano, status, foto };
          showToast('Sócio atualizado com sucesso!', '✅');
        }
      } else {
        const newSocio = {
          id: `SOC-${Date.now()}`,
          nome,
          email,
          telefone,
          dataNascimento,
          plano,
          status,
          foto,
          dataAdesao: new Date().toISOString()
        };
        socios.push(newSocio);
        showToast('Sócio cadastrado com sucesso!', '✅');
      }

      closeModal();
      renderView();
    }

    function showToast(message, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3000);
    }

    function phoneMask(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 11) value = value.substring(0, 11);
      
      if (value.length > 6) {
        value = `(${value.substring(0, 2)}) ${value.substring(2, 7)}-${value.substring(7)}`;
      } else if (value.length > 2) {
        value = `(${value.substring(0, 2)}) ${value.substring(2)}`;
      } else if (value.length > 0) {
        value = `(${value}`;
      }
      
      input.value = value;
    }

    document.getElementById('form-socio').addEventListener('submit', saveSocio);
    document.getElementById('search-input').addEventListener('input', renderView);
    document.getElementById('filter-status').addEventListener('change', renderView);
    document.getElementById('filter-plano').addEventListener('change', renderView);
    document.getElementById('socio-telefone').addEventListener('input', function() { phoneMask(this); });

    renderView();
  </script>

  <script src="menu-loader.js"></script>
 </body>
</html>

<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrato Pix - Sistema de Gestão de Sócios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .transaction-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .transaction-card:hover {
      transform: translateX(4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
  </style>
 </head>
 <body class="h-full bg-slate-50">
  <div id="menu-container"></div>
  <div id="app" class="h-full overflow-auto">

   <main class="ml-64 p-8">
    <!-- Header -->
    <div class="mb-8">
     <h1 class="text-3xl font-bold text-slate-800">Extrato Pix</h1>
     <p class="text-slate-600 mt-2">Histórico de pagamentos via Pix</p>
    </div>

    <!-- Filtros -->
    <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
     <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div>
       <label for="data-inicio" class="block text-sm font-medium text-slate-700 mb-2">Data Inicial</label>
       <input type="date" id="data-inicio" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
      </div>
      <div>
       <label for="data-fim" class="block text-sm font-medium text-slate-700 mb-2">Data Final</label>
       <input type="date" id="data-fim" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
      </div>
      <div>
       <label for="filtro-nome" class="block text-sm font-medium text-slate-700 mb-2">Nome do Remetente</label>
       <input type="text" id="filtro-nome" placeholder="Buscar por nome..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
      </div>
      <div class="flex items-end gap-2">
       <button id="btn-filtrar" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
        Filtrar
       </button>
       <button id="btn-limpar" class="flex-1 bg-slate-300 hover:bg-slate-400 text-slate-800 font-medium py-2 px-4 rounded-lg transition-colors">
        Limpar
       </button>
      </div>
     </div>
    </div>

    <!-- Estatísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
     <div class="bg-white p-6 rounded-xl shadow-sm">
      <p class="text-slate-500 text-sm font-medium">Total de Transações</p>
      <p class="text-3xl font-bold text-slate-800 mt-2" id="total-transacoes">0</p>
     </div>
     <div class="bg-white p-6 rounded-xl shadow-sm">
      <p class="text-slate-500 text-sm font-medium">Valor Total Recebido</p>
      <p class="text-3xl font-bold text-emerald-600 mt-2" id="valor-total">R$ 0,00</p>
     </div>
     <div class="bg-white p-6 rounded-xl shadow-sm">
      <p class="text-slate-500 text-sm font-medium">Período</p>
      <p class="text-sm text-slate-800 mt-2" id="periodo-exibicao">Sem filtro</p>
     </div>
    </div>

    <!-- Tabela de Transações -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
     <div class="p-6 border-b border-slate-200">
      <h2 class="text-lg font-semibold text-slate-800">Transações Pix</h2>
     </div>
     <div class="overflow-x-auto">
      <table class="w-full">
       <thead class="bg-slate-50 border-b border-slate-200">
        <tr>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Data</th>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Hora</th>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Remetente</th>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Valor</th>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Descrição</th>
         <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Status</th>
        </tr>
       </thead>
       <tbody id="tabela-transacoes" class="divide-y divide-slate-200">
        <!-- Transações serão inseridas aqui -->
       </tbody>
      </table>
     </div>
     <div id="mensagem-vazia" class="text-center py-12">
      <svg class="w-12 h-12 text-slate-400 mx-auto mb-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
      </svg>
      <p class="text-slate-600 text-lg">Nenhuma transação encontrada</p>
     </div>
    </div>

   </main>
  </div>

  <script>
    // Mock data de transações Pix
    const pixTransactions = [
      {
        id: 1,
        data: '2026-02-06',
        hora: '14:30',
        remetente: 'João Silva',
        valor: 150.00,
        descricao: 'Mensalidade - Plano Básico',
        status: 'Confirmado'
      },
      {
        id: 2,
        data: '2026-02-06',
        hora: '13:15',
        remetente: 'Maria Santos',
        valor: 200.00,
        descricao: 'Mensalidade - Plano Premium',
        status: 'Confirmado'
      },
      {
        id: 3,
        data: '2026-02-05',
        hora: '16:45',
        remetente: 'Pedro Oliveira',
        valor: 250.00,
        descricao: 'Mensalidade - Plano VIP',
        status: 'Confirmado'
      },
      {
        id: 4,
        data: '2026-02-05',
        hora: '11:20',
        remetente: 'Ana Costa',
        valor: 150.00,
        descricao: 'Mensalidade - Plano Básico',
        status: 'Confirmado'
      },
      {
        id: 5,
        data: '2026-02-04',
        hora: '15:00',
        remetente: 'Carlos Ferreira',
        valor: 200.00,
        descricao: 'Mensalidade - Plano Premium',
        status: 'Confirmado'
      },
      {
        id: 6,
        data: '2026-02-04',
        hora: '09:30',
        remetente: 'Julia Mendes',
        valor: 150.00,
        descricao: 'Mensalidade - Plano Básico',
        status: 'Confirmado'
      },
      {
        id: 7,
        data: '2026-02-03',
        hora: '12:45',
        remetente: 'Roberto Santos',
        valor: 300.00,
        descricao: 'Aluguel - Salão de Festas',
        status: 'Confirmado'
      },
      {
        id: 8,
        data: '2026-02-02',
        hora: '18:15',
        remetente: 'Fernanda Costa',
        valor: 175.00,
        descricao: 'Mensalidade - Plano Básico',
        status: 'Confirmado'
      },
      {
        id: 9,
        data: '2026-02-01',
        hora: '10:00',
        remetente: 'Lucas Alves',
        valor: 250.00,
        descricao: 'Mensalidade - Plano VIP',
        status: 'Confirmado'
      },
      {
        id: 10,
        data: '2026-01-31',
        hora: '14:20',
        remetente: 'Bruna Silva',
        valor: 200.00,
        descricao: 'Mensalidade - Plano Premium',
        status: 'Confirmado'
      }
    ];

    let transacoesFiltradasAtual = [...pixTransactions];

    function formatarMoeda(valor) {
      return 'R$ ' + valor.toFixed(2).replace('.', ',');
    }

    function renderizarTabela(transacoes) {
      const tabela = document.getElementById('tabela-transacoes');
      const mensagemVazia = document.getElementById('mensagem-vazia');

      tabela.innerHTML = '';

      if (transacoes.length === 0) {
        mensagemVazia.style.display = 'block';
        document.querySelector('table').style.display = 'none';
        return;
      }

      document.querySelector('table').style.display = 'table';
      mensagemVazia.style.display = 'none';

      transacoes.forEach(transacao => {
        const row = document.createElement('tr');
        row.className = 'transaction-card hover:bg-slate-50 transition-colors';
        row.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-800">${transacao.data}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-800">${transacao.hora}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center">
                <span class="text-xs font-bold text-emerald-600">${transacao.remetente.charAt(0)}</span>
              </div>
              <span class="text-sm font-medium text-slate-800">${transacao.remetente}</span>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-sm font-bold text-emerald-600">${formatarMoeda(transacao.valor)}</span>
          </td>
          <td class="px-6 py-4 text-sm text-slate-600">${transacao.descricao}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
              ${transacao.status}
            </span>
          </td>
        `;
        tabela.appendChild(row);
      });

      atualizarEstatisticas(transacoes);
    }

    function atualizarEstatisticas(transacoes) {
      const totalTransacoes = transacoes.length;
      const valorTotal = transacoes.reduce((sum, t) => sum + t.valor, 0);

      document.getElementById('total-transacoes').textContent = totalTransacoes;
      document.getElementById('valor-total').textContent = formatarMoeda(valorTotal);

      // Atualizar período
      const dataInicio = document.getElementById('data-inicio').value;
      const dataFim = document.getElementById('data-fim').value;

      if (dataInicio || dataFim) {
        const inicio = dataInicio ? new Date(dataInicio).toLocaleDateString('pt-BR') : 'início';
        const fim = dataFim ? new Date(dataFim).toLocaleDateString('pt-BR') : 'fim';
        document.getElementById('periodo-exibicao').textContent = `${inicio} até ${fim}`;
      } else {
        document.getElementById('periodo-exibicao').textContent = 'Sem filtro';
      }
    }

    function filtrar() {
      const dataInicio = document.getElementById('data-inicio').value;
      const dataFim = document.getElementById('data-fim').value;
      const filtroNome = document.getElementById('filtro-nome').value.toLowerCase();

      transacoesFiltradasAtual = pixTransactions.filter(transacao => {
        let passaFiltro = true;

        if (dataInicio && transacao.data < dataInicio) {
          passaFiltro = false;
        }

        if (dataFim && transacao.data > dataFim) {
          passaFiltro = false;
        }

        if (filtroNome && !transacao.remetente.toLowerCase().includes(filtroNome)) {
          passaFiltro = false;
        }

        return passaFiltro;
      });

      renderizarTabela(transacoesFiltradasAtual);
    }

    function limparFiltros() {
      document.getElementById('data-inicio').value = '';
      document.getElementById('data-fim').value = '';
      document.getElementById('filtro-nome').value = '';
      transacoesFiltradasAtual = [...pixTransactions];
      renderizarTabela(transacoesFiltradasAtual);
    }

    // Event listeners
    document.getElementById('btn-filtrar').addEventListener('click', filtrar);
    document.getElementById('btn-limpar').addEventListener('click', limparFiltros);

    // Permitir Enter no campo de nome para filtrar
    document.getElementById('filtro-nome').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') filtrar();
    });

    // Inicializar
    renderizarTabela(pixTransactions);
  </script>

  <script src="menu-loader.js"></script>
 </body>
</html>
